name: Deploy to GitHub Pages

on:
  # 当推送到 main 分支时触发部署
  push:
    branches: [main]
  # 允许你在 Actions 页面手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许写入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Install, build, and upload your site output
        uses: withastro/action@v3
        with:
          path: . # 项目的根目录
          node-version: 20 # 指定 Node.js 版本，推荐 18 或 20
          package-manager: npm@latest # 如果你用的是 npm，请改为 npm；如果是 yarn，改为 yarn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
